         <!---Form section available for users to get easy quotes---->
        <div class="quote-box" id="contact-link">
            <h2>GET A FREE QUOTE</h2>
            <!--This form is essential on each page to enforce and encourage customer response to action calls -->
            <form>
            <!--This is the complete/type section-->
                <div class="side-by-side">
                    <label for="name">First Name</label>
                    <br>
                    <input type="text" id="name" required>
                    <br>
                    <label for="surname">Last name</label>
                    <br>
                    <input type="text" id="surname" required>
                </div>
                <br>
                <label for="email">Email Address </label>
                <br>
                <input type="text" id="email" required>
                <br>
                <label for="phone">Phone</label>
                <br>
                <input type="text" id="phone" required>
                <br>
                <!---Beginning of services selection section---->
                <h5>Select your preferred services:</h5>
                <label>
                <input type="checkbox" value="landscaping">
                    Landscaping
                </label>
                <br>
                <label>
                    <input type="checkbox" value="landscaping">
                    Gardening services
                    <br>
                    <label> 
                        <input type="checkbox">
                        Weekly
                        <br>
                        <input type="checkbox">
                        Monthly
                        </label>
                </label>
                <br>
                <label>
                    <input type="checkbox">
                    Composting and garden-waste management
                </label>
                <br>
                <label>
                    <input type="checkbox">
                    Planting, soil and pest control services 
                </label>
                <br> 
                <label>
                    <input type="checkbox">
                    Irrigation and water management services 
                </label>
                <br>
                <label>
                    <input type="checkbox">
                    Paving and garden lighting
                </label>
                <br>
                <h5>Message:</h5>
                <input type="text" id="message" required>
                <br>
                <button class="submit-button">Submit</button>
            </form>
